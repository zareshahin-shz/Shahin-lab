<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131c">
  <title>Shahin Lab | آزمایشگاه دیجیتال</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #10131c; color: #fff;
      font-family: Tahoma, Arial, sans-serif;
    }
    main {
      width: 100%; max-width: 740px; padding: 48px 28px;
      border: 1px solid #343a4a; border-radius: 26px;
      background: #1b2030; text-align: center;
    }
    .tag { color: #ff8a52; font-size: 13px; letter-spacing: 2px; }
    h1 { font-size: clamp(25px, 5vw, 38px); margin: 22px 0 16px; }
    p { color: #c4cada; line-height: 2.1; font-size: 17px; }
    .status {
      display: inline-block; margin-top: 22px; padding: 13px 18px;
      border-radius: 12px; background: #283d35; color: #8fe0b3;
    }
    footer { margin-top: 26px; color: #858da2; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="tag">SHAHIN ZARE / DIGITAL LAB</div>
    <h1>آزمایشگاه دیجیتال شاهین</h1>
    <p>محیط اختصاصی برای ساخت، آزمایش و توسعه ایده‌ها با کمک هوش مصنوعی شاهین.</p>
    <div class="status">● محیط آزمایشی آماده توسعه است</div>
    <footer>Shahin Lab · مستقل از پروژه‌های دیگر</footer>
  </main>
</body>
</html>
